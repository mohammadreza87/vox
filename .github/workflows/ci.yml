name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.3'

jobs:
  # =====================================
  # Lint & Type Check (fast feedback)
  # =====================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Studio style rules
        run: npm run check:studio-style && node --test scripts/check-studio-style.test.mjs

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # =====================================
  # Unit & Integration Tests
  # =====================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsconfig.json excludes test files; tsconfig.test.json type-checks the test files changed since main 7224f40
      # and every src/**/hardening-*.test.ts(x) (see its header for scope and the pre-existing errors left out).
      - name: Typecheck changed tests
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          # Provide minimal env vars for tests
          NEXT_PUBLIC_FIREBASE_API_KEY: test-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project

      - name: Verify offline inventory CLI and generated source parity
        run: node --test scripts/legacy-offline-inventory.test.mjs

      - name: Verify bounded Firebase preview inventory
        run: node --test scripts/firebase-preview-inventory.test.mjs

      - name: Verify Connections release configuration preservation
        run: node --test scripts/connections-production-config.test.mjs

      - name: Verify single-host release safety and configuration preservation
        run: node --test scripts/studio-production.test.mjs scripts/studio-skill-routing-config.test.mjs scripts/studio-adaptive-compatibility.test.mjs scripts/studio-rights-erasure-compatibility.test.mjs scripts/rights-intake-storage.test.mjs

      - name: Verify guest browser fixture build provenance
        run: node --test e2e/guest-fixture-build.test.mjs

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # =====================================
  # Privacy gates (docs/AGENT_INTELLIGENCE_SOLUTION.md section 5, step 8):
  # the invariant suite, the red-team gate and the PolicySnapshotBuilder
  # differential oracle, flags unset and again under the S08 flags. Making
  # this job a required check is a branch-protection setting for the owner.
  # =====================================
  privacy-gates:
    name: Privacy gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Section 4.6's red-team gate: invariants, the differential oracle, every red-team suite, negative-identity
      # retrieval through the full pipeline, the audience/indexed boundary suites (members added or removed and
      # consent revoked mid-turn), memory replacement, the combined runtime and their cached-prompt wrappers.
      - name: Privacy core and red-team suites, flags unset
        run: >-
          npx vitest run
          src/lib/tireh/__tests__/invariants.test.ts
          src/lib/tireh/__tests__/policy-differential.test.ts
          src/lib/tireh/__tests__/redteam
          src/lib/tireh/__tests__/visibility.test.ts
          src/lib/tireh/__tests__/memory-privacy.test.ts
          src/lib/tireh/__tests__/history-privacy.test.ts
          src/lib/tireh/__tests__/memory-requests.test.ts
          src/lib/tireh/__tests__/negative-identity
          src/lib/tireh/__tests__/audience-boundary.test.ts
          src/lib/tireh/__tests__/indexed-boundary.test.ts
          src/lib/tireh/__tests__/memory-replacement.test.ts
          src/lib/tireh/__tests__/combined-runtime.test.ts
          src/lib/tireh/__tests__/cached-prompt-suite-audience-boundary.test.ts
          src/lib/tireh/__tests__/cached-prompt-suite-indexed-boundary.test.ts
          src/lib/tireh/__tests__/cached-prompt-suite-memory-privacy.test.ts
          src/lib/tireh/__tests__/cached-prompt-suite-memory-replacement.test.ts
          src/lib/tireh/__tests__/cached-prompt-suite-combined-runtime.test.ts
          src/lib/tireh/__tests__/cached-prompt-suite-visibility.test.ts
          src/lib/tireh/__tests__/memory-eval
          src/lib/studio/__tests__/sharing-v2
          src/lib/studio/__tests__/boundary-revisions.test.ts
          src/lib/studio/__tests__/visibility.test.ts
          src/lib/studio/__tests__/qa-code-quality-r2-successor.test.ts

      - name: Negative-identity, visibility, memory privacy and the memory eval under TIREH_RETRIEVAL_V2
        run: >-
          npx vitest run
          src/lib/tireh/__tests__/negative-identity
          src/lib/tireh/__tests__/memory-privacy.test.ts
          src/lib/tireh/__tests__/visibility.test.ts
          src/lib/tireh/__tests__/memory-eval
        env:
          TIREH_RETRIEVAL_V2: '1'

      - name: Invariants, differential oracle and red-team gate under TIREH_SHARING_V2 and TIREH_AUDIT_LOG
        run: >-
          npx vitest run
          src/lib/tireh/__tests__/invariants.test.ts
          src/lib/tireh/__tests__/policy-differential.test.ts
          src/lib/tireh/__tests__/redteam-wave-a
          src/lib/studio/__tests__/sharing-v2.test.ts
        env:
          TIREH_SHARING_V2: '1'
          TIREH_AUDIT_LOG: '1'

  # =====================================
  # Build Verification
  # =====================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, privacy-gates]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Build-time environment variables (use secrets if available, fallback to test values)
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'test-key' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'test.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'test-project' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'test-bucket' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '123456' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:123:web:abc' }}
          # Skip telemetry during CI
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify build output
        run: |
          echo "Checking for .next directory..."
          ls -la
          if [ -d ".next" ]; then
            echo ".next directory exists"
            ls -la .next/
          else
            echo "ERROR: .next directory not found!"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: build-output
          path: .next/
          # upload-artifact v4.4+ skips hidden paths by default, and .next is one.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  # =====================================
  # E2E Tests (optional, runs on main only)
  # =====================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        id: download-artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-output
          path: .next

      - name: Build if no artifact
        if: steps.download-artifact.outcome == 'failure'
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'test-key' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'test.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'test-project' }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run adaptive production browser journey
        run: npx playwright test --config=e2e/adaptive.config.ts

      - name: Run scoped relationship production browser journeys
        run: npx playwright test --config=playwright.relationships.config.ts --project=chromium
        env:
          RELATIONSHIP_E2E_PRODUCTION: '1'

      - name: Run scoped conversation production browser journeys
        run: npx playwright test --config=playwright.conversation.config.ts
        env:
          CONVERSATION_E2E_PRODUCTION: '1'

      - name: Run observation and correction production browser journeys
        run: npx playwright test --config=playwright.observation.config.ts

      - name: Run isolated guest privacy production browser journeys
        run: npx playwright test --config=playwright.guest-rights.config.ts

      # All production journeys must run before the general suite starts next dev,
      # which replaces .next and removes the downloaded production BUILD_ID.
      - name: Run Connections production browser fixtures
        run: npm run e2e:connections
        env:
          CONNECTIONS_E2E_PRODUCTION: '1'

      - name: Run reminder production browser journeys
        run: npx playwright test --config=playwright.reminders.config.ts --project=chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # =====================================
  # Security Audit
  # =====================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Don't fail CI, but report issues

  # =====================================
  # PR Comment with Summary
  # =====================================
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [lint, test, privacy-gates, build, e2e]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## CI Summary')
            );

            const body = `## CI Summary ✅

            | Check | Status |
            |-------|--------|
            | Lint & Type Check | ✅ Passed |
            | Tests | ✅ Passed |
            | Privacy gates | ✅ Passed |
            | Build | ✅ Passed |
            | Browser journeys | ✅ Passed |

            *Last updated: ${new Date().toISOString()}*
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
