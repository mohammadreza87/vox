name: Preview Deploy

on:
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22.23.3'

jobs:
  # ============================================
  # Deploy Preview to Firebase Hosting
  # ============================================
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      # action-hosting-deploy creates a check run for the preview
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Firebase config packaging
        run: |
          npx --yes firebase-tools@15.34.0 --version
          node --test scripts/firebase-config-packaging.test.mjs

      - name: Prepare cached Firebase preview inventory CLI
        id: preview_inventory_cli
        continue-on-error: true
        run: |
          node --test scripts/firebase-preview-inventory.test.mjs
          npx --offline --yes --package=firebase-tools@15.34.0 -c 'command -v firebase' > "$RUNNER_TEMP/vox-preview-inventory-cli-path"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const bin = fs.realpathSync(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'vox-preview-inventory-cli-path'), 'utf8').trim());
          const root = path.resolve(path.dirname(bin), '../..');
          const pkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          if (pkg.name !== 'firebase-tools' || pkg.version !== '15.34.0' || /[\r\n]/.test(root)) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `cli_root=${root}\n`);
          NODE

      - name: Build application
        run: npm run build
        env:
          # Use secrets if available, fallback to test values for build compatibility
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'test-key' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'test.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'test-project' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'test-bucket' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '123456' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:123:web:abc' }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy Preview to Firebase
        id: preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          firebaseToolsVersion: 15.34.0
          # Creates a unique preview channel for this PR
          expires: 7d
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Verify preview HTTP behavior
        timeout-minutes: 2
        run: node --test scripts/firebase-preview-verify.test.mjs && node scripts/firebase-preview-verify.mjs
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.details_url }}

      - name: Comment Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.preview.outputs.details_url }}';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## Preview Deployment')
            );

            const body = `## Preview Deployment 🚀

            Preview HTTP checks passed: landing and Studio pages load, and the worker rejects unauthenticated requests. This does not certify configured Studio providers or real Telegram delivery.

            | | |
            |---|---|
            | **Preview URL** | ${previewUrl} |
            | **Commit** | \`${{ github.event.pull_request.head.sha }}\` |
            | **Expires** | 7 days |

            ---
            *This preview expires after 7 days.*
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Inventory preview channels (read only)
        id: preview_inventory
        if: ${{ always() && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && steps.preview_inventory_cli.outcome == 'success' && (steps.preview.outcome == 'success' || steps.preview.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 1
        run: node scripts/firebase-preview-inventory.mjs
        env:
          FIREBASE_INVENTORY_CLI_ROOT: ${{ steps.preview_inventory_cli.outputs.cli_root }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Report preview inventory status
        if: ${{ always() && !cancelled() }}
        run: |
          echo 'Preview deploy outcome: ${{ steps.preview.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview inventory tool preparation: ${{ steps.preview_inventory_cli.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Read-only preview inventory outcome: ${{ steps.preview_inventory.outcome }}' >> "$GITHUB_STEP_SUMMARY"
