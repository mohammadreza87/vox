name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: vox-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Firebase's framework deploy invokes Next build again. Keep real settings
    # available to both builds; the validated .env also reaches the SSR function.
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      STUDIO_SECRET: ${{ secrets.STUDIO_SECRET }}
      VOXX_BOT_TOKEN: ${{ secrets.VOXX_BOT_TOKEN }}
      VOXX_BOT_USERNAME: ${{ vars.VOXX_BOT_USERNAME || 'VoxxBot' }}
      STUDIO_SUPERADMIN_IDS: ${{ vars.STUDIO_SUPERADMIN_IDS || secrets.STUDIO_SUPERADMIN_IDS }}
      STUDIO_PUBLIC_URL: ${{ vars.STUDIO_PUBLIC_URL || 'https://vox-aicontact-fe0e3.web.app' }}
      STUDIO_MEDIA_BUCKET: ${{ vars.STUDIO_MEDIA_BUCKET || secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      STUDIO_ORG_NAME: ${{ vars.STUDIO_ORG_NAME || 'HOOR' }}
      STUDIO_RELATIONSHIPS: ${{ vars.STUDIO_RELATIONSHIPS || 'off' }}
      STUDIO_RELATIONSHIP_AGENTS: ${{ vars.STUDIO_RELATIONSHIP_AGENTS }}
      STUDIO_RELATIONSHIP_PEOPLE: ${{ vars.STUDIO_RELATIONSHIP_PEOPLE }}
      STUDIO_RELATIONSHIP_ROLES: ${{ vars.STUDIO_RELATIONSHIP_ROLES }}
      STUDIO_RELATIONSHIP_WORKER_SECRET: ${{ secrets.STUDIO_RELATIONSHIP_WORKER_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      STUDIO_STORAGE: firestore
      STUDIO_ONLY: '1'
      STUDIO_BOTS: '0'
      STUDIO_REVISION: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit --incremental false

      - name: Unit tests
        run: npm run test -- --run

      - name: Deployment script tests
        run: node --test scripts/firebase-production-env.test.mjs scripts/firebase-production-verify.test.mjs scripts/firebase-relationship-infra.test.mjs

      - name: Verify Firebase config packaging
        run: |
          npx --yes firebase-tools@15.34.0 --version
          node --test scripts/firebase-config-packaging.test.mjs

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare relationship infrastructure
        run: node scripts/firebase-relationship-infra.mjs prepare
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Validate production configuration
        run: node scripts/firebase-production-env.mjs

      - name: Build application
        run: npm run build

      - name: Deploy to Firebase Hosting
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          firebaseToolsVersion: 15.34.0
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Register bots and verify production
        run: node scripts/firebase-production-verify.mjs

      - name: Verify and activate relationship worker
        run: node scripts/firebase-relationship-infra.mjs activate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Pause relationship worker after release failure
        if: failure()
        run: node scripts/firebase-relationship-infra.mjs pause
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deployment summary
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { productionOrigin } from './scripts/firebase-production-env.mjs';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Verified production deployment\n\n- URL: ${productionOrigin(process.env.STUDIO_PUBLIC_URL)}/studio\n- Commit: ${process.env.STUDIO_REVISION}\n- Webhook registration and production checks passed.\n`);
          NODE

      - name: Remove generated server configuration
        if: always()
        run: rm -f .env
